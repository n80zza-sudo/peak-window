name: Build Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm install
      - name: Prepare web files
        run: |
          mkdir -p www
          for f in index.html manifest.json icon.svg; do
            if [ -f "$f" ]; then cp "$f" www/; fi
          done
          test -f www/index.html || { echo "index.html is missing from the repository"; exit 1; }
      - run: npx cap add android
      - run: npx cap sync android
      - name: Set app name
        run: |
          f=android/app/src/main/res/values/strings.xml
          sed -i 's#<string name="app_name">[^<]*</string>#<string name="app_name">Gains Through Action</string>#; s#<string name="title_activity_main">[^<]*</string>#<string name="title_activity_main">Gains Through Action</string>#' "$f"
      - name: Generate icons if provided
        continue-on-error: true
        run: |
          mkdir -p assets
          for f in icon-only.png icon-foreground.png icon-background.png; do
            if [ -f "$f" ]; then cp "$f" assets/; fi
          done
          if [ -f assets/icon-only.png ]; then npx capacitor-assets generate --android; fi
      - name: Allow notifications and exact alarms
        run: |
          f=android/app/src/main/AndroidManifest.xml
          sed -i 's#</manifest>#    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <uses-permission android:name="android.permission.SCHEDULE_EXACT_ALARM"/>\n</manifest>#' "$f"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: peak-window-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
